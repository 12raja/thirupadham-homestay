server.port=8081
spring.application.name=booking-service

# These ${...} values are read from environment variables at container
# startup - in Kubernetes, they'll come from the postgres-secret Secret
# via envFrom, so the actual password never appears in this file or in Git.
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# "update" auto-creates/updates tables to match the @Entity classes - handy
# for learning, but real production systems use proper migration tools
# (Flyway/Liquibase) instead, since "update" can be unpredictable at scale.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Falls back to the Kubernetes Service DNS name if no override is given.
notification.service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:8082/api/notify}
