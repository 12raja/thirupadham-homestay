<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{page.admin.title}">Admin — Thirupadham Homestay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Martel:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="site-header">
    <div class="wrap admin-topbar">
        <div class="brand" th:text="#{admin.brand}">Thirupadham Homestay — Admin</div>
        <div style="display:flex; align-items:center; gap:16px;">
            <span class="lang-toggle"><a href="?lang=en">EN</a> / <a href="?lang=ta">தமிழ்</a></span>
            <form method="post" th:action="@{/logout}">
                <button type="submit" class="btn btn-outline" style="padding:8px 16px;" th:text="#{admin.logout}">Log out</button>
            </form>
        </div>
    </div>
</header>

<section>
    <div class="wrap">
        <h2 class="section-title" th:text="#{admin.upload.heading}">Upload a photo</h2>
        <p class="section-lede" th:text="#{admin.upload.lede}">Goes straight onto the homepage gallery.</p>

        <form class="booking-form" th:action="@{/admin/upload}" method="post" enctype="multipart/form-data">
            <div class="field">
                <label for="photo" th:text="#{admin.upload.label}">Choose a photo</label>
                <input type="file" id="photo" name="photo" accept="image/*" required>
            </div>
            <p th:if="${uploadError}" th:text="${uploadError}" style="color:var(--color-oxide);"></p>
            <button type="submit" class="btn btn-primary" th:text="#{admin.upload.submit}">Upload</button>
        </form>

        <h2 class="section-title" style="margin-top:48px;" th:text="#{admin.photos.heading}">Current photos</h2>
        <div class="photo-grid">
            <img th:each="photo : ${photos}" th:src="@{${photo}}" alt="">
        </div>
        <p th:if="${#lists.isEmpty(photos)}" style="color:var(--color-granite);" th:text="#{admin.photos.empty}">No photos uploaded yet.</p>
    </div>
</section>

</body>
</html>
