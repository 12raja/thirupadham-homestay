# ---------- Page titles / meta ----------
page.home.title=திருபாதம் தங்குமிடம் — இஷா யோகா மையத்திற்கு அருகில் அமைதியான தங்குமிடம்
page.home.description=செம்மேட்டில் தூய்மையான, அமைதியான அறைகள், இஷா யோகா மையத்திலிருந்து சில நிமிட நடையில். வாகன நிறுத்துமிடம், குடும்பங்களுக்கு ஏற்றது, உங்கள் வருகைக்கு முன்/பின் ஓய்வெடுக்க இடம்.
page.login.title=நிர்வாக உள்நுழைவு — திருபாதம் தங்குமிடம்
page.admin.title=நிர்வாகம் — திருபாதம் தங்குமிடம்
page.confirmation.title=விசாரணை பெறப்பட்டது — திருபாதம் தங்குமிடம்
page.error.title=விசாரணை அனுப்பப்படவில்லை — திருபாதம் தங்குமிடம்

# ---------- Welcome overlay ----------
welcome.close.label=வரவேற்பு செய்தியை மூடு
welcome.heading=திருபாதம் தங்குமிடத்திற்கு வரவேற்கிறோம்
welcome.body=நீங்கள் நலமாக இருப்பீர்கள் என நம்புகிறோம். எங்களைப் பார்வையிட்டதற்கு நன்றி — செம்மேட்டில் உங்கள் தங்குமிடத்தை நாங்கள் ஏற்பாடு செய்ய ஆவலாக உள்ளோம்.

# ---------- Hero ----------
hero.heading=செம்மேட்டில் இஷா யோகா மையத்திற்கு அருகில் அமைந்த அமைதியான அறை
hero.body=தூய்மையான, விசாலமான அறைகளும் அமைதியான முற்றமும் — தியான பயணிகளுக்கும், குடும்பங்களுக்கும், தமிழ்நாட்டின் இப்பகுதி வழியாக செல்பவர்களுக்கும் ஏற்றது.
hero.cta.book=முன்பதிவு விசாரணை அனுப்பவும்
hero.cta.whatsapp=WhatsApp-ல் தொடர்பு கொள்ளவும்

# ---------- About ----------
about.heading=வரவேற்பு
about.lede=இது ஒரு தங்குமிடம், ஹோட்டல் அல்ல — ஒரு குடும்பமே இதை நடத்துகிறது, அது தெரியும்.
about.body=திருபாதம் தங்குமிடம் செம்மேட்டில் அமைந்துள்ளது, இஷா யோகா மையத்திலிருந்து சில நிமிட நடையில். நீங்கள் ஆசிரமத்தில் ஒரு நிகழ்ச்சிக்காக வந்திருந்தாலும், குடும்பத்துடன் பயணம் செய்தாலும், அல்லது தமிழ்நாட்டில் தூய்மையான அறையும் அமைதியான இரவும் தேவைப்பட்டாலும், இது உண்மையிலேயே ஓய்வெடுக்கும் இடம்.

# ---------- Gallery ----------
gallery.heading=உள்ளே ஒரு பார்வை
gallery.more=+{0} மேலும்

# ---------- Facilities ----------
facilities.heading=இங்கு என்ன இருக்கிறது
facilities.lede=ஒவ்வொரு முறையும் நாங்கள் சரியாகச் செய்யும் நான்கு விஷயங்கள்.
facility.rooms.title=வசதியான அறைகள்
facility.rooms.body=தூக்கத்திற்கு மட்டுமல்ல, ஓய்விற்காகவே கட்டப்பட்ட தூய்மையான, விசாலமான அறைகள்.
facility.parking.title=வாகன நிறுத்துமிடம்
facility.parking.body=உங்கள் காருக்கோ பைக்குக்கோ இடத்திலேயே இடம் உண்டு.
facility.family.title=குடும்பத்திற்கு ஏற்றது
facility.family.body=குழந்தைகள், முதியோர் என அனைவருக்கும் ஏற்றவாறு அமைக்கப்பட்டுள்ளது.
facility.isha.title=இஷாவிற்கு எளிதான வழி
facility.isha.body=இஷா யோகா மைய வாசலுக்கு சில நிமிட நடை தூரம்.

