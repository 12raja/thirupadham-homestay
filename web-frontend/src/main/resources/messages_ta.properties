# ---------- Error page ----------
error.heading=அந்த விசாரணையை அனுப்ப முடியவில்லை
error.body=முன்பதிவு அமைப்பு இப்போது பதிலளிக்கவில்லை. உங்கள் தகவல் எதுவும் இழக்கப்படவில்லை — சிறிது நேரத்தில் மீண்டும் முயற்சிக்கவும், அல்லது நேரடியாக எங்களைத் தொடர்பு கொள்ளவும்.
error.whatsapp=WhatsApp-ல் எங்களை தொடர்பு கொள்ளவும்
