server.port=8080
spring.application.name=web-frontend

# Points at booking-service's Kubernetes Service name by default.
booking.service.url=${BOOKING_SERVICE_URL:http://booking-service:8081/api/bookings}

# Placeholder number - override with the real WhatsApp number via the
# HOMESTAY_WHATSAPP_NUMBER environment variable before real guests see this site.
homestay.whatsapp-number=${HOMESTAY_WHATSAPP_NUMBER:919999999999}

# Admin login - backed by a Kubernetes Secret, never hardcoded here.
homestay.admin-username=${HOMESTAY_ADMIN_USERNAME:admin}
homestay.admin-password=${HOMESTAY_ADMIN_PASSWORD:changeme}

# Where uploaded photos are stored - must match the PVC mount path in the
# Kubernetes Deployment, otherwise uploads succeed but the app can't find them.
homestay.upload-dir=${HOMESTAY_UPLOAD_DIR:/data/uploads}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Public listing page - shown as a fallback link.
airbnb.listing-url=${AIRBNB_LISTING_URL:}

# Private calendar export URL - contains an access token, so this is only
# ever set via an environment variable/Secret, never written here.
airbnb.ical-url=${AIRBNB_ICAL_URL:}

# Twilio Verify - Account SID/Auth Token come from the shared twilio-secret
# (same credentials notification-service uses). The Verify Service SID
# itself isn't sensitive, just an identifier, so it's safe as a default here.
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:VAa63e83906b534a201b912daa4199ddd3}
